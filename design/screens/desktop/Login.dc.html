<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Munchy desktop — Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Climate+Crisis&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&amp;family=Space+Mono:wght@400;700&amp;family=Figtree:wght@400;500;600&amp;family=Anuphan:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#1D5C3A}a:hover{color:#164A2E}
input::placeholder{color:#8A8272}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F7F2EA; font-family: 'Figtree', 'Anuphan', sans-serif; color: #1E1C18">
  <section style="flex: 1 1 440px; min-width: 0; box-sizing: border-box; margin: 20px; border-radius: 28px; background: #1D5C3A; color: #F7F2EA; padding: 48px; display: flex; flex-direction: column; gap: 28px; position: relative; overflow: hidden">
    <a href="Guest.dc.html" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none">
      <img src="../../logo/logo-text-cream.png" alt="Munchy" style="height: 30px; width: auto; align-self: flex-start">
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #E3C27A">Your Bite Buddy</span>
    </a>
    <h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 44px; line-height: 1.12; max-width: 460px">Know what's in every bite, <span style="font-style: italic; color: #E3C27A">without the guesswork.</span></h2>
    <div style="display: flex; flex-direction: column; gap: 12px; font-size: 15px; color: #D6E2D9">
      <span style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E3C27A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>Any dish, Thai or English</span>
      <span style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E3C27A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-7M12 20V5M19 20v-11"></path></svg>Your week, streak and weight</span>
      <span style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E3C27A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>Ideas for what fits next</span>
    </div>
    <img src="../../assets/bowl.png" alt="" style="margin-top: auto; align-self: flex-end; width: 260px; height: 260px">
  </section>
  <main style="flex: 1 1 440px; min-width: 0; box-sizing: border-box; padding: 48px 40px; display: flex; align-items: center; justify-content: center">
    <form style="margin: 0; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px">
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #8A5F1A">Log in</span>
      <h1 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 40px; line-height: 1.12; color: #1E1C18">Welcome <span style="font-style: italic; color: #1D5C3A">back</span></h1>
      <p style="margin: 0; font-size: 15px; color: #6B6457">Pick up where you left off: today's bites, your target and your week.</p>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="l-e" style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #6B6457">Email</label><input id="l-e" type="email" style="height: 50px; width: 100%; box-sizing: border-box; border: 1px solid #E2D8C6; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1E1C18; outline: none"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="l-p" style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #6B6457">Password</label><input id="l-p" type="password" style="height: 50px; width: 100%; box-sizing: border-box; border: 1px solid #E2D8C6; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1E1C18; outline: none"></div>
      <a href="Home.dc.html" style="height: 56px; border-radius: 18px; background: #1D5C3A; color: #F7F2EA; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Log in</a>
      <p style="margin: 0; text-align: center; font-size: 14px; color: #6B6457">New here? <a href="Onboarding.dc.html" style="font-weight: 600">Create a free account</a></p>
      <a href="Guest.dc.html" style="text-align: center; font-size: 14px; font-weight: 600">Back to search</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
