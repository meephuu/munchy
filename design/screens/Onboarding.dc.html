<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Munchy — Get started</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Climate+Crisis&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&amp;family=Space+Mono:wght@400;700&amp;family=Figtree:wght@400;500;600&amp;family=Anuphan:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#1D5C3A}a:hover{color:#164A2E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F2EA; font-family: 'Figtree', 'Anuphan', sans-serif; color: #1E1C18">
  <div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; padding-top: 8px">
      <img src="../assets/bowl.png" alt="Ramen bowl illustration" style="width: 64px; height: 64px; flex: none">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Climate Crisis', sans-serif; font-size: 30px; line-height: 1; color: #1D5C3A">Munchy</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #8A5F1A">Your Bite Buddy</span>
      </div>
    </div>

    <h1 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; line-height: 1.15">How much should you eat, <span style="font-style: italic; color: #1D5C3A">every day?</span></h1>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #6B6457">Your goal</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
          <button type="button" onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="{{g.style}}">{{g.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="v2age" style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #6B6457">Age</label>
        <input id="v2age" type="number" value="21" style="height: 46px; box-sizing: border-box; border: 1px solid #E2D8C6; border-radius: 12px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 15px; color: #1E1C18; width: 100%">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="v2height" style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #6B6457">Height cm</label>
        <input id="v2height" type="number" value="174" style="height: 46px; box-sizing: border-box; border: 1px solid #E2D8C6; border-radius: 12px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 15px; color: #1E1C18; width: 100%">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="v2weight" style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #6B6457">Weight kg</label>
        <input id="v2weight" type="number" value="68" style="height: 46px; box-sizing: border-box; border: 1px solid #E2D8C6; border-radius: 12px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 15px; color: #1E1C18; width: 100%">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #6B6457">Your typical day</span>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{acts}}" as="a" hint-placeholder-count="3">
          <button type="button" onClick="{{a.pick}}" aria-pressed="{{a.on}}" style="{{a.style}}">{{a.label}}</button>
        </sc-for>
      </div>
    </div>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 20px rgba(70,50,20,0.08)">
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #8A5F1A">Your daily target</span>
      <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Climate Crisis', sans-serif; font-size: 36px; line-height: 1; color: #1D5C3A">{{kcal}}</span><span style="font-size: 14px; font-weight: 600">kcal</span></div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="font-size: 12px; font-weight: 600; background: #E6EFE8; color: #1D5C3A; padding: 4px 10px; border-radius: 6px">Protein {{p}} g</span>
        <span style="font-size: 12px; font-weight: 600; background: #F3ECDF; color: #8A5F1A; padding: 4px 10px; border-radius: 6px">Carbs {{c}} g</span>
        <span style="font-size: 12px; font-weight: 600; background: #F6E4DC; color: #A5452A; padding: 4px 10px; border-radius: 6px">Fat {{f}} g</span>
      </div>
    </section>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; align-items: center">
    <a href="Main.dc.html" style="width: 100%; height: 56px; border-radius: 18px; background: #1D5C3A; color: #F7F2EA; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 600">Let's munch</a>
    <span style="font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.5px; color: #6B6457">NOT MEDICAL ADVICE · CHECK WITH A PRO IF YOU HAVE A CONDITION</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { goal: 'maintain', act: 'desk' }; }
  renderVals() {
    var self = this, s = this.state;
    var chip = function (on) {
      return 'height: 44px; padding: 0 12px; border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; ' +
        (on ? 'background: #1D5C3A; color: #F7F2EA; border: 1px solid #1D5C3A' : 'background: #FFFFFF; color: #1E1C18; border: 1px solid #E2D8C6');
    };
    var goalDefs = [['lose', 'Lose weight', 1850, 130], ['maintain', 'Stay balanced', 2150, 110], ['gain', 'Gain weight', 2450, 120], ['muscle', 'Build muscle', 2350, 140]];
    var actDefs = [['desk', 'Desk job', 0], ['feet', 'On my feet', 200], ['active', 'Very active', 400]];
    var kcal = 0, p = 0;
    var goals = goalDefs.map(function (d) {
      var on = s.goal === d[0]; if (on) { kcal += d[2]; p = d[3]; }
      return { label: d[1], on: on ? 'true' : 'false', style: chip(on), pick: function () { self.setState({ goal: d[0] }); } };
    });
    var acts = actDefs.map(function (d) {
      var on = s.act === d[0]; if (on) kcal += d[2];
      return { label: d[1], on: on ? 'true' : 'false', style: chip(on) + '; flex: 1', pick: function () { self.setState({ act: d[0] }); } };
    });
    var f = Math.round(kcal * 0.28 / 9);
    var c = Math.round((kcal - p * 4 - f * 9) / 4);
    return { goals: goals, acts: acts, kcal: kcal.toLocaleString('en-US'), p: p, c: c, f: f };
  }
}
</script>
</body>
</html>
