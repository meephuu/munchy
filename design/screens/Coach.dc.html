<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Munchy — Coach</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Climate+Crisis&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&amp;family=Space+Mono:wght@400;700&amp;family=Figtree:wght@400;500;600&amp;family=Anuphan:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#1D5C3A}a:hover{color:#164A2E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F2EA; font-family: 'Figtree', 'Anuphan', sans-serif; color: #1E1C18">
  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px">
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #8A5F1A">Coach · Dinner · 18:40</span>
      <h1 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; line-height: 1.15">What should I eat, <span style="font-style: italic; color: #1D5C3A">and how much?</span></h1>
    </header>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 20px rgba(70,50,20,0.08)">
      <img src="../assets/bowl.png" alt="" style="width: 64px; height: 64px; flex: none">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #8A5F1A">Room left today</span>
        <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Climate Crisis', sans-serif; font-size: 30px; line-height: 1; color: #1D5C3A">600</span><span style="font-size: 13px; font-weight: 600">kcal</span></div>
        <span style="font-size: 12px; color: #6B6457">and <b style="color: #1E1C18">40 g protein</b> to go</span>
      </div>
    </section>

    <div style="display: flex; gap: 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ideas}}" as="i" hint-placeholder-count="3">
        <div style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 14px rgba(70,50,20,0.06)">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 14px; font-weight: 600">{{i.name}}</span>
            <span style="font-family: 'Space Mono', monospace; font-size: 10px; color: #6B6457">{{i.where}}</span>
            <div style="display: flex; gap: 6px; margin-top: 4px">
              <span style="font-size: 11px; font-weight: 600; background: #F3ECDF; color: #8A5F1A; padding: 3px 8px; border-radius: 6px">{{i.kcal}} kcal</span>
              <span style="font-size: 11px; font-weight: 600; background: #E6EFE8; color: #1D5C3A; padding: 3px 8px; border-radius: 6px">P {{i.p}} g</span>
            </div>
          </div>
          <a href="Analyze.dc.html" aria-label="Log this dish" style="width: 44px; height: 44px; border-radius: 12px; background: #1D5C3A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </a>
        </div>
      </sc-for>
    </div>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 14px rgba(70,50,20,0.06)">
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #A5452A">Smart swap</span>
      <span style="font-size: 14px">Fried chicken rice → <b style="color: #1D5C3A">Khao man gai (boiled)</b></span>
      <span style="font-size: 12px; color: #6B6457">Saves about <b style="color: #1E1C18">200 kcal</b>, same protein.</span>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 16px; height: 68px; background: #FFFFFF; border-radius: 22px; display: flex; align-items: center; justify-content: space-around; box-shadow: 0 8px 24px rgba(70,50,20,0.14)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6457; text-decoration: none; font-size: 10px; min-width: 52px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Coach.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #1D5C3A; text-decoration: none; font-size: 10px; font-weight: 600; min-width: 52px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>Coach</a>
    <a href="Analyze.dc.html" aria-label="Log a dish" style="width: 52px; height: 52px; border-radius: 50%; background: #1D5C3A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -26px; border: 4px solid #F7F2EA">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Progress.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6457; text-decoration: none; font-size: 10px; min-width: 52px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-7M12 20V5M19 20v-11"></path></svg>Progress</a>
    <a href="Onboarding.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6457; text-decoration: none; font-size: 10px; min-width: 52px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'near' }; }
  renderVals() {
    var self = this, tab = this.state.tab;
    var chip = function (on) {
      return 'height: 34px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; ' +
        (on ? 'background: #1D5C3A; color: #F7F2EA; border: 1px solid #1D5C3A' : 'background: #FFFFFF; color: #1E1C18; border: 1px solid #E2D8C6');
    };
    var defs = [['near', 'Near me'], ['seven', '7-Eleven'], ['home', 'Cook at home']];
    var tabs = defs.map(function (d) {
      var on = d[0] === tab;
      return { label: d[1], on: on ? 'true' : 'false', style: chip(on), pick: function () { self.setState({ tab: d[0] }); } };
    });
    var data = {
      near: [
        { name: 'Chicken suki soup', where: 'FOOD COURT · 350 M', kcal: 380, p: 34 },
        { name: 'Clear tom yum + half rice', where: 'STREET STALL · 200 M', kcal: 420, p: 32 },
        { name: 'Som tam + grilled chicken', where: 'STREET STALL · 500 M', kcal: 480, p: 38 }
      ],
      seven: [
        { name: 'Chicken breast + onigiri', where: '7-ELEVEN · 2 ITEMS', kcal: 360, p: 36 },
        { name: 'Greek yogurt + boiled eggs', where: '7-ELEVEN · 3 ITEMS', kcal: 290, p: 28 },
        { name: 'Tuna sandwich + soy milk', where: '7-ELEVEN · 2 ITEMS', kcal: 410, p: 26 }
      ],
      home: [
        { name: 'Tofu & veggie stir-fry + rice', where: '15 MIN · 4 INGREDIENTS', kcal: 450, p: 26 },
        { name: 'Pork omelette (less oil)', where: '10 MIN · 3 INGREDIENTS', kcal: 520, p: 30 },
        { name: 'Chicken & veg clear soup', where: '20 MIN · 5 INGREDIENTS', kcal: 340, p: 35 }
      ]
    };
    return { tabs: tabs, ideas: data[tab] };
  }
}
</script>
</body>
</html>
